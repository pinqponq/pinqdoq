<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pinqponq-agents</title>
<style>
:root {
  --bg: #f5f5f2; --surface: #ffffff; --surface-2: #f0f0ec; --border: #e3e3dd; --text: #1b1b19; --muted: #6e6e66; --faint: #9a9a92;
  --accent: #a9770a; --accent-soft: #fff3d6; --ok: #2e7d32; --ok-soft: #e6f4e7; --warn: #a85d00; --warn-soft: #fff0dc; --bad: #c62828; --bad-soft: #fde8e8;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e0e0e; --surface: #17171a; --surface-2: #202024; --border: #2a2a2e; --text: #efefec; --muted: #a0a098; --faint: #6c6c66;
    --accent: #ffc964; --accent-soft: #2f2716; --ok: #6cc070; --ok-soft: #16271a; --warn: #ffb74d; --warn-soft: #2e2214; --bad: #ef6b6b; --bad-soft: #2e1717; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
a { color: inherit; }
header { display: flex; align-items: center; gap: 18px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
nav button.on { color: var(--text); background: var(--surface-2); font-weight: 600; }
#updated { color: var(--faint); font-size: 12px; }
#usage { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); }
.meter { display: flex; align-items: center; gap: 6px; }
.meter .track { display: block; width: 64px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.meter .fill { display: block; height: 100%; background: var(--ok); }
.meter.mid .fill { background: var(--warn); } .meter.high .fill { background: var(--bad); }
.meter b { color: var(--text); font-variant-numeric: tabular-nums; }
.usage-chart svg { width: 100%; height: 180px; display: block; }
.usage-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.usage-legend i { display: inline-block; width: 10px; height: 3px; margin-right: 6px; vertical-align: middle; }
main { padding: 24px; max-width: 1440px; margin: 0 auto; }
section > h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 32px 0 12px; display: flex; align-items: center; gap: 10px; }
section > h2:first-child { margin-top: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.avatar { display: inline-flex; flex: none; position: relative; }
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar .fallback { width: 100%; height: 100%; border-radius: 30%; background: var(--surface-2); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.avatar.live::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 28%; height: 28%; min-width: 8px; min-height: 8px; border-radius: 50%; background: var(--ok); border: 2px solid var(--surface); }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.selected, .pill.in_progress, .pill.changes_requested { background: var(--accent-soft); color: var(--accent); }
.pill.pr_open, .pill.merged { background: var(--ok-soft); color: var(--ok); }
.pill.waiting_reply, .pill.needs_human, .pill.verification_blocked { background: var(--warn-soft); color: var(--warn); }
button { font: inherit; cursor: pointer; }
.btn { background: var(--accent); color: #141414; border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
.btn:disabled { opacity: .35; cursor: default; }
.btn-ghost { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 5px 12px; font-size: 13px; }
.btn-ghost:hover { color: var(--text); border-color: var(--muted); }
.btn-link { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px 0; }
.btn-link:hover { color: var(--text); }

.attention { display: grid; gap: 8px; }
.alert { display: flex; gap: 14px; align-items: center; background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: var(--radius); padding: 14px 18px; }
.alert.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.alert .icon { font-size: 20px; }
.alert b { font-size: 16px; }
.all-good { display: flex; gap: 10px; align-items: center; color: var(--ok); font-weight: 600; font-size: 16px; }

.runner.active { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.runner-head { display: flex; gap: 14px; align-items: center; }
.runner-name { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.runner-elapsed { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-left: auto; }
.runner-task { margin: 12px 0 4px; font-size: 21px; font-weight: 650; }
.runner-task .card-key { font-size: 24px; }
.runner-task .card-title { font-size: 15px; font-weight: 400; }
.runner-now { font-size: 16px; margin-top: 12px; display: flex; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.runner-now .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; flex: none; }
.runners-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 32px 0 12px; }
.runners-heading h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; }
.idle-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.idle-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 13px; }
.idle-chip .dot { width: 8px; height: 8px; }
.idle-chip .btn { padding: 4px 12px; font-size: 13px; border-radius: 999px; }
.detail-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); display: grid; gap: 16px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat .value { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .label { font-size: 12px; color: var(--muted); }
.agent { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; }
.events { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; max-height: 300px; overflow: auto; }
.events li { padding: 4px 0; border-top: 1px solid var(--border); display: grid; grid-template-columns: 52px 1fr; gap: 10px; }
.events li.text { color: var(--muted); font-style: italic; }

.list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.question { display: block; padding: 16px 18px; border-top: 1px solid var(--border); }
.question:first-child { border-top: 0; }
.question-text { font-size: 15px; line-height: 1.45; margin: 8px 0 12px; }
.question-id { font-weight: 700; color: var(--warn); margin-right: 6px; }
.options { display: flex; gap: 8px; flex-wrap: wrap; }
.option { background: var(--warn-soft); border: 1px solid transparent; color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 13px; text-align: left; }
.option:hover { border-color: var(--warn); }
.option b { margin-right: 6px; }
.option .recommended { color: var(--warn); font-size: 11px; margin-left: 6px; }
.item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-top: 1px solid var(--border); }
.item:first-child { border-top: 0; }
.item-title { font-size: 16px; font-weight: 600; line-height: 1.35; }
.item-meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rank { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; flex: none; font-size: 15px; }
.rank.dim { background: var(--surface-2); color: var(--muted); }
.empty { padding: 18px; color: var(--muted); }
.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; align-items: start; }
.columns > div > h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 32px 0 12px; display: flex; align-items: center; gap: 10px; }
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 1fr); gap: 16px; overflow-x: auto; align-items: start; padding-bottom: 8px; }
.kanban h3 { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 600; display: flex; gap: 8px; }
.card-key { font-size: 16px; font-weight: 700; color: var(--text); text-decoration: none; }
.card-key:hover { text-decoration: underline; }
.card-title { font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 3px; }
.kanban .list { max-height: calc(100vh - 230px); overflow-y: auto; }

.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.kpi .value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .label { font-size: 13px; color: var(--muted); }
.kpi .sub { font-size: 12px; color: var(--faint); margin-top: 4px; }
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 90px; gap: 4px 12px; align-items: center; }
.bar-row .name { font-size: 14px; font-weight: 550; }
.bar-row .value { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.bar { grid-column: 2 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
input, select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }

.map-wrap { position: relative; overflow-x: auto; }
.map { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 16px; position: relative; min-width: 1120px; padding-bottom: 8px; }
.map-column h3 { font-size: 12px; color: var(--muted); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.node { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; cursor: pointer; font-size: 13px; font-weight: 550; position: relative; z-index: 1; transition: opacity .15s; display: flex; gap: 8px; align-items: center; }
.node span.label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map.focus .node { opacity: .2; }
.map.focus .node.related { opacity: 1; }
.map.focus .node.uses { border-color: var(--accent); }
.map.focus .node.used-by { border-color: var(--ok); }
.map.focus .node.current { opacity: 1; border-color: var(--text); box-shadow: 0 0 0 2px var(--accent); }
#map-lines { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: visible; }
.map-detail pre { max-height: 520px; overflow: auto; background: var(--surface-2); padding: 12px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.link-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
.link-list .pill { cursor: pointer; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.legend i { display: inline-block; width: 16px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.log div { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; word-break: break-word; }
.log div:last-child { border-bottom: 0; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; display: none; max-width: 90vw; z-index: 10; }
@media (max-width: 640px) {
  main { padding: 16px; } header { padding: 10px 16px; }
  .runner-task .card-key { font-size: 20px; } .runner-elapsed { font-size: 18px; } .kpi .value { font-size: 24px; }
  .item { padding: 12px 14px; }
}
</style>
</head>
<body>
<header>
  <h1>pinqponq-agents</h1>
  <nav id="tabs">
    <button data-tab="now" class="on">Şimdi</button>
    <button data-tab="queue">Sıra</button>
    <button data-tab="board">Board</button>
    <button data-tab="metrics">Metrikler</button>
    <button data-tab="map">Harita</button>
    <button data-tab="log">Log</button>
  </nav>
  <div id="usage"></div>
  <span id="updated">yükleniyor…</span>
</header>
<main>
  <section id="tab-now">
    <div id="attention"></div>
    <div class="runners-heading"><h2>Runnerlar</h2><div class="idle-chips" id="idle-runners"></div></div>
    <div class="stack" id="active-runners"></div>
    <div class="columns">
      <div><h2>Sıradaki</h2><div class="list" id="up-next"></div></div>
      <div><h2><button class="btn-link" data-toggle="history" id="history-toggle"></button></h2><div id="history"></div></div>
    </div>
  </section>

  <section id="tab-queue" hidden></section>

  <section id="tab-board" hidden>
    <div class="toolbar">
      <input id="search" placeholder="Ara: başlık veya numara" style="flex:1;min-width:200px">
      <select id="column-filter"></select>
    </div>
    <div class="tiny faint" id="board-updated" style="margin-bottom:8px"></div>
    <div class="kanban" id="board"></div>
  </section>

  <section id="tab-metrics" hidden>
    <div class="toolbar">
      <select id="metrics-days"><option value="1">Son 24 saat</option><option value="3" selected>Son 3 gün</option><option value="7">Son 7 gün</option><option value="30">Son 30 gün</option></select>
      <button class="btn-ghost" id="metrics-reload">Yenile</button>
    </div>
    <h2 style="margin-top:8px">Günlük kullanım</h2>
    <div class="card usage-chart" id="usage-chart"></div>
    <div class="kpis" id="metrics-kpis" style="margin-top:20px"></div>
    <div class="columns">
      <div><h2>En çok token kullanan tasklar</h2><div class="card"><div class="bars" id="metrics-top-tasks"></div></div></div>
      <div><h2>Agentlar</h2><div class="card"><div class="bars" id="metrics-top-agents"></div></div></div>
    </div>
    <div style="margin-top:24px"><button class="btn-link" data-toggle="metrics-tables" id="metrics-tables-toggle"></button></div>
    <div id="metrics-tables"></div>
  </section>

  <section id="tab-map" hidden>
    <div class="legend"><span>Bir kutuya tıkla, bağlantıları çizilsin.</span><span><i style="background:var(--accent)"></i>kullandıkları</span><span><i style="background:var(--ok)"></i>onu kullananlar</span><button class="btn-ghost" id="map-reload">Yenile</button></div>
    <div class="map-wrap"><div class="map" id="map"></div></div>
    <div class="card map-detail" id="map-detail" style="margin-top:16px"><span class="muted">Ayrıntı için bir kutu seç.</span></div>
  </section>

  <section id="tab-log" hidden>
    <div class="card log" id="runs-log"></div>
  </section>
</main>
<div id="toast"></div>
<script type="module">
const REFRESH_MILLISECONDS = 5000;
const STUCK_TOOL_SECONDS = 15 * 60;
const PENDING_START_WARNING_SECONDS = 120;
const BLOBATAR_URL = "https://cdn.jsdelivr.net/npm/blobatar@2.7.0/+esm";
const BLOBATAR_EXPRESSION_URL = "https://cdn.jsdelivr.net/npm/blobatar@2.7.0/dist/expression.js/+esm";
const QUEUEABLE = new Set([undefined, null, "proposed", "skipped", "declined"]);
const WAITING_ON_OWNER = ["waiting_reply", "needs_human", "verification_blocked"];
const STATUS_LABELS = { selected: "sırada", in_progress: "yapılıyor", changes_requested: "düzeltme istendi", waiting_reply: "cevap bekliyor",
  needs_human: "sana ihtiyaç var", verification_blocked: "doğrulama takıldı", pr_open: "PR açık", merged: "merge edildi",
  proposed: "önerildi", skipped: "atlandı", declined: "reddedildi" };
let overview = null;
const expanded = new Set();
const RECENT_HISTORY_COUNT = 6;
const USAGE_MID_PERCENT = 70;
const USAGE_HIGH_PERCENT = 90;
const USAGE_TABLE_DAYS = 7;
const BOARD_COLUMN_ORDER = ["Todo", "In progress", "Waiting for human review", "In Review", "Backlog", "Done"];

const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));
const issueUrl = (key) => { const [repository, number] = key.split("#"); return `https://github.com/${repository}/issues/${number}`; };
const shortKey = (key) => key.replace(/^pinqponq\//, "");
const formatTokens = (count) => count >= 1e6 ? (count / 1e6).toFixed(1) + "M" : count >= 1e3 ? Math.round(count / 1e3) + "k" : String(count || 0);
const formatClock = (timestamp) => timestamp ? new Date(timestamp).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }) : "";
const formatDateTime = (timestamp) => timestamp ? new Date(timestamp).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
const isLockedByRunner = (task) => overview.locks.some((lock) => !lock.stale && lock.name === "task-" + task.key.replace(/[/#]/g, "_"));
const waitingVerification = () => overview.tasks.filter((task) => task.needs_verification && !isLockedByRunner(task));
const runnerLabel = (name) => (overview && overview.runner_labels && overview.runner_labels[name]) || name;
const taskHeading = (key, title) => `<a class="card-key" href="${issueUrl(key)}" target="_blank">${escapeHtml(shortKey(key))}</a>`
  + (title ? `<div class="card-title">${escapeHtml(title)}</div>` : "");
const formatDuration = (seconds) => !seconds ? "0 dk" : seconds < 60 ? `${seconds} sn` : seconds < 3600 ? `${Math.round(seconds / 60)} dk` : `${Math.floor(seconds / 3600)} sa ${Math.round(seconds % 3600 / 60)} dk`;
const elapsedSeconds = (from, to) => from && to ? Math.max(0, Math.round((new Date(to) - new Date(from)) / 1000)) : 0;
const statusPill = (status) => status ? `<span class="pill ${escapeHtml(status)}">${escapeHtml(STATUS_LABELS[status] || status)}</span>` : "";
const toggleLabel = (id, closedText, openText) => expanded.has(id) ? openText : closedText;

/* ---------- avatarlar (blobatar) ---------- */

let blobatarLibrary = null;
const avatarCache = new Map();
Promise.all([import(BLOBATAR_URL), import(BLOBATAR_EXPRESSION_URL)])
  .then(([core, expressions]) => { blobatarLibrary = { render: core.blobatar, expressions }; avatarCache.clear(); if (overview) render(); if (systemMap) renderSystemMap(); })
  .catch((error) => console.warn("blobatar yüklenemedi, baş harf kullanılıyor", error));

// mood: "working" | "idle" | "sleeping" | "stuck" | "done"
function avatar(name, size, mood = "idle") {
  const cacheKey = `${name}|${size}|${mood}`;
  if (!avatarCache.has(cacheKey)) {
    let markup = `<span class="fallback">${escapeHtml(name.replace(/^pin-/, "").slice(0, 2).toUpperCase())}</span>`;
    if (blobatarLibrary) {
      const expressionByMood = { working: "thinking", sleeping: "sleepy", stuck: "scared", done: "happy", idle: "idle" };
      markup = blobatarLibrary.render(name, { title: name, expression: blobatarLibrary.expressions[expressionByMood[mood]] });
    }
    avatarCache.set(cacheKey, markup);
  }
  return `<span class="avatar ${mood === "working" ? "live" : ""}" style="width:${size}px;height:${size}px">${avatarCache.get(cacheKey)}</span>`;
}

function isStuck(worker) {
  const pending = worker.pending_tool;
  return Boolean(pending && !pending.tool.startsWith("Agent") && pending.waiting_seconds > STUCK_TOOL_SECONDS);
}

function workerMood(worker) {
  if (!worker.active) return "done";
  return isStuck(worker) ? "stuck" : "working";
}

function titleFor(key) {
  const task = overview.tasks.find((candidate) => candidate.key === key);
  if (task?.title) return task.title;
  return (overview.board.find((item) => item.key === key) || {}).title || "";
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.style.display = "block";
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.style.display = "none", 3500);
}

async function postAction(path, body) {
  const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Pinqloq-Panel": "1" }, body: JSON.stringify(body) });
  const result = await response.json();
  if (!response.ok) { showToast("Olmadı: " + result.error); return null; }
  await refresh();
  return result;
}

function taskKeyForSession(session) {
  const lock = overview.locks.find((candidate) => candidate.session === session.runner_session && candidate.name.startsWith("task-"));
  if (lock) {
    const task = overview.tasks.find((candidate) => "task-" + candidate.key.replace(/[/#]/g, "_") === lock.name);
    if (task) return task.key;
  }
  return session.active ? null : session.main_task;
}

function currentActivity(session) {
  const runningAgent = session.subagents.slice().reverse().find((agent) => agent.active);
  if (runningAgent) return { agent: runningAgent, who: runningAgent.type, what: runningAgent.description };
  const lastEvent = session.events[session.events.length - 1];
  return lastEvent ? { who: lastEvent.kind === "text" ? "not" : lastEvent.tool, what: lastEvent.summary } : { who: "", what: "başlıyor" };
}

/* ---------- Şimdi ---------- */

function collectAttention() {
  const alerts = [];
  for (const task of overview.tasks.filter((candidate) => WAITING_ON_OWNER.includes(candidate.status))) {
    alerts.push({ icon: "✋", title: task.title || shortKey(task.key), text: `${STATUS_LABELS[task.status]}${task.open_questions ? ` · ${task.open_questions} açık soru` : ""} · ${shortKey(task.key)}`, href: issueUrl(task.key) });
  }
  for (const session of overview.sessions.filter((candidate) => candidate.active)) {
    for (const worker of [session, ...session.subagents.filter((agent) => agent.active)]) {
      if (isStuck(worker)) {
        alerts.push({ icon: worker.type ? avatar(worker.type, 36, "stuck") : "⏳", severity: "bad",
          title: `${worker.type || (session.scheduled_task ? runnerLabel(session.scheduled_task) : "oturum")} ${formatDuration(worker.pending_tool.waiting_seconds)}dır tek bir ${worker.pending_tool.tool} komutunu bekliyor`,
          text: "İzin isteği bekliyor olabilir, Claude uygulamasına bak", raw: true });
      }
    }
  }
  for (const lock of overview.locks.filter((candidate) => candidate.stale)) {
    alerts.push({ icon: "🔒", title: `Eski kilit: ${lock.name}`, text: `${formatDuration(lock.age_seconds)}dır dokunulmamış; sonraki runner devralır` });
  }
  for (const request of overview.start_requests.filter((candidate) => candidate.status === "pending" && elapsedSeconds(candidate.requested_at, overview.now) > PENDING_START_WARNING_SECONDS)) {
    alerts.push({ icon: "▶️", title: `${runnerLabel(request.scheduled_task)} başlatma isteği bekliyor`, text: `${formatClock(request.requested_at)}'da istendi; isteği işleyen Claude sohbeti kapalı olabilir` });
  }
  return alerts;
}

function renderAttention() {
  const alerts = collectAttention();
  document.getElementById("attention").innerHTML = alerts.length
    ? `<div class="attention">${alerts.map((alert) => `<div class="alert ${alert.severity || ""}"><span class="icon">${alert.icon}</span><div class="grow">
        <b>${alert.href ? `<a href="${alert.href}" target="_blank">${escapeHtml(alert.title)}</a>` : escapeHtml(alert.title)}</b>
        <div class="small muted">${escapeHtml(alert.text)}</div></div></div>`).join("")}</div>`
    : `<div class="all-good"><span class="dot on"></span>Senden bekleyen bir şey yok</div>`;
}

function renderEvents(events) {
  return `<ul class="events">${events.slice().reverse().map((event) => `<li class="${event.kind}"><span class="faint">${formatClock(event.at)}</span>
    <span>${event.kind === "text" ? "" : `<span class="muted">${escapeHtml(event.tool)}</span> · `}${escapeHtml(event.summary)}</span></li>`).join("")}</ul>`;
}

function renderSessionDetail(session) {
  const agents = session.subagents.slice().reverse().map((agent) => `<div class="agent">
      <div class="row spread"><div class="row grow">${avatar(agent.type, 30, workerMood(agent))}<b>${escapeHtml(agent.type)}</b><span class="small muted ellipsis grow">${escapeHtml(agent.description)}</span></div>
        <span class="small muted">${formatDuration(agent.wall_seconds)} · ${agent.tool_calls} adım</span></div>
      <button class="btn-link" data-toggle="${escapeHtml(agent.id)}">${toggleLabel(agent.id, "Adımları göster", "Adımları gizle")}</button>
      ${expanded.has(agent.id) ? renderEvents(agent.events) : ""}</div>`).join("");
  const stat = (value, label) => `<div class="stat"><div class="value">${value}</div><div class="label">${label}</div></div>`;
  return `<div class="detail-box">
    <div class="stats">${stat(formatClock(session.started_at), "başladı")}${stat(session.tool_calls, "adım")}${stat(formatDuration(session.model_seconds), "model süresi")}
      ${stat(formatTokens(session.peak_context_tokens), "en büyük bağlam")}${stat(formatTokens(session.cache_read_tokens), "cache okuma")}</div>
    ${agents ? `<div><div class="small muted" style="margin-bottom:8px">Agentlar (${session.subagents.length})</div><div class="stack" style="gap:8px">${agents}</div></div>` : ""}
    <div><div class="small muted">Son adımlar</div>${renderEvents(session.events)}</div>
  </div>`;
}

function renderRunners() {
  const activeSessions = overview.sessions.filter((session) => session.active);
  document.getElementById("active-runners").innerHTML = activeSessions.map((session) => {
    const taskKey = taskKeyForSession(session);
    const activity = currentActivity(session);
    const runnerName = session.scheduled_task ? runnerLabel(session.scheduled_task) : "elle açılan oturum";
    const detailId = "session-" + session.id;
    return `<div class="card runner active">
      <div class="runner-head"><span class="dot ${workerMood(session) === "working" ? "on" : ""}"></span>
        <div><div class="runner-name">${escapeHtml(runnerName)}</div><div class="small muted">${formatClock(session.started_at)}'da başladı</div></div>
        <span class="runner-elapsed">${formatDuration(elapsedSeconds(session.started_at, overview.now))}</span></div>
      <div class="runner-task">${taskKey ? taskHeading(taskKey, titleFor(taskKey)) : "Bakım işleri ve task seçimi"}</div>
      <div class="runner-now">${activity.agent ? avatar(activity.agent.type, 30, workerMood(activity.agent)) : `<span class="label">Şu an</span>`}
        <span><b>${escapeHtml(activity.who)}</b> ${escapeHtml(activity.what)}</span></div>
      <div style="margin-top:10px"><button class="btn-link" data-toggle="${detailId}">${toggleLabel(detailId, "Detay ▾", "Detayı kapat ▴")}</button></div>

  }).join("") || `<div class="card small muted">Çalışan runner yok. Sağ üstten başlatabilirsin.</div>`;
  const busyNames = new Set(activeSessions.map((session) => session.scheduled_task));
  document.getElementById("idle-runners").innerHTML = overview.runner_names.filter((name) => !busyNames.has(name)).map((name) => {
    const pending = overview.start_requests.find((request) => request.scheduled_task === name && request.status === "pending");
    return `<span class="idle-chip" title="${pending ? "başlatılıyor…" : "boşta"}"><span class="dot ${pending ? "on" : ""}"></span>${escapeHtml(runnerLabel(name))}

  }).join("");
}

function renderUpNext() {
  const lockedLockNames = new Set(overview.locks.filter((lock) => !lock.stale).map((lock) => lock.name));
  const waitingTasks = overview.queue.filter((task) => !lockedLockNames.has("task-" + task.key.replace(/[/#]/g, "_")));
  const next = waitingTasks.slice(0, 3);
  document.getElementById("up-next").innerHTML = next.length ? next.map((task, index) => `<div class="item">
      <span class="rank ${index ? "dim" : ""}">${index + 1}</span>
      <div class="grow">${taskHeading(task.key, task.title)}
        <div class="item-meta">${statusPill(task.status)}${task.blocked_by.length ? `<span>bekliyor: ${escapeHtml(task.blocked_by.map(shortKey).join(", "))}</span>` : ""}</div></div></div>`).join("")
    + (waitingTasks.length > 3 ? `<div class="item"><button class="btn-link" data-goto="queue">Tüm sıra (${waitingTasks.length}) →</button></div>` : "")
    : `<div class="empty">Bekleyen task yok. Board'dan sıraya alabilirsin.</div>`;
  const verificationTasks = waitingVerification();
  if (verificationTasks.length) {
    document.getElementById("up-next").innerHTML += `<div class="item"><div class="grow small muted">Ayrıca ${verificationTasks.length} task merge sonrası doğrulama bekliyor; runner bunları da alır:
      ${verificationTasks.map((task) => `<a href="${issueUrl(task.key)}" target="_blank">${escapeHtml(shortKey(task.key))}</a>`).join(", ")}</div></div>`;
  }
}

function renderHistory() {
  const finished = overview.sessions.filter((session) => !session.active);
  const shownFinished = expanded.has("history") ? finished : finished.slice(0, RECENT_HISTORY_COUNT);
  document.getElementById("history-toggle").textContent = finished.length > RECENT_HISTORY_COUNT
    ? toggleLabel("history", `Son koşular · tümü (${finished.length}) ▾`, "Son koşular · daralt ▴") : "Son koşular";
  document.getElementById("history").innerHTML = finished.length ? `<div class="list">${shownFinished.map((session) => {
    const taskKey = session.main_task;
    const detailId = "session-" + session.id;

        <div class="grow">${idle ? `<div class="small muted">Boşta geçti</div>` : taskKey ? taskHeading(taskKey, titleFor(taskKey)) : `<div class="item-title">Bakım işleri</div>`}
          <div class="item-meta"><span>${formatDateTime(session.started_at)}</span><span>${escapeHtml(session.scheduled_task ? runnerLabel(session.scheduled_task) : "elle")}</span><span>${formatDuration(session.wall_seconds)}</span></div></div>
        ${idle ? "" : `<button class="btn-link" data-toggle="${detailId}">${toggleLabel(detailId, "Detay ▾", "Kapat ▴")}</button>`}</div>

function taskItem(task, rank) {
  return `<div class="item">
    ${rank != null ? `<span class="rank ${rank > 1 ? "dim" : ""}">${rank}</span>` : ""}
    <div class="grow">${taskHeading(task.key, task.title)}
      <div class="item-meta">${statusPill(task.status)}
        ${task.queue_priority != null ? `<span>öncelik ${task.queue_priority}</span>` : ""}
        ${task.blocked_by.length ? `<span>bekliyor: ${escapeHtml(task.blocked_by.map(shortKey).join(", "))}</span>` : ""}
        ${task.open_questions ? `<span style="color:var(--warn)">${task.open_questions} açık soru</span>` : ""}

    <div class="row">
      ${["selected", "in_progress", "changes_requested"].includes(task.status) ? `<button class="btn-ghost" data-priority="${escapeHtml(task.key)}" data-current="${task.queue_priority ?? ""}">Öncelik</button>` : ""}
      ${task.status === "selected" ? `<button class="btn-ghost" data-unqueue="${escapeHtml(task.key)}">Çıkar</button>` : ""}</div></div>`;
}

const QUESTION_HIDDEN_STATUSES = ["skipped", "declined", "merged", "done"];

function parseQuestion(questionText) {
  const separatorIndex = questionText.indexOf(":");
  const id = questionText.slice(0, separatorIndex).trim();
  const body = questionText.slice(separatorIndex + 1).trim();
  const optionsMatch = body.match(/\(([^()]*\b[A-Z]:[^()]*)\)\s*$/);
  const optionsText = optionsMatch ? optionsMatch[1] : "";
  const options = [...optionsText.matchAll(/(?:^|[\/;])\s*([A-Z]):\s*([^\/;]+)/g)].map((match) => ({ letter: match[1], label: match[2].trim() }));
  const recommendedMatch = optionsText.match(/öneri\s+([A-Z])\b/i);
  return { id, text: optionsMatch && options.length ? body.slice(0, optionsMatch.index).trim() : body, options,
    recommended: recommendedMatch ? recommendedMatch[1].toUpperCase() : null };
}

function renderQuestions() {
  const tasksWithQuestions = overview.tasks.filter((task) => task.questions.length);
  const activeTasks = tasksWithQuestions.filter((task) => !QUESTION_HIDDEN_STATUSES.includes(task.status));
  const hiddenCount = tasksWithQuestions.length - activeTasks.length;
  const hiddenNote = hiddenCount ? `<div class="small faint" style="margin-top:6px">${hiddenCount} task'ta daha soru var ama task atlanmış/kapanmış, runner cevap beklemiyor.</div>` : "";
  if (!activeTasks.length) return `<div class="section" style="margin-bottom:24px"><h2>Cevap bekleyen sorular <span class="faint">0</span></h2><div class="list"><div class="empty">Runner'ın senden beklediği bir soru yok</div></div>${hiddenNote}</div>`;
  const cards = activeTasks.flatMap((task) => task.questions.map((questionText) => {
    const question = parseQuestion(questionText);
    const optionButtons = question.options.map((option) => `<button class="option" data-answer-key="${escapeHtml(task.key)}" data-answer-question="${escapeHtml(question.id)}" data-answer-value="${escapeHtml(option.letter)}"><b>${escapeHtml(option.letter)}</b>${escapeHtml(option.label)}${option.letter === question.recommended ? `<span class="recommended">öneri</span>` : ""}</button>`).join("");
    return `<div class="question">${taskHeading(task.key, task.title)}
      <div class="question-text"><span class="question-id">${escapeHtml(question.id)}</span>${escapeHtml(question.text)}</div>
      <div class="options">${optionButtons}<button class="btn-ghost" data-answer-key="${escapeHtml(task.key)}" data-answer-question="${escapeHtml(question.id)}">${question.options.length ? "Başka cevap…" : "Cevap yaz…"}</button>
        <a class="btn-link" href="${escapeHtml(issueUrl(task.key))}" target="_blank">Issue →</a></div></div>`;
  }));
  return `<div class="section" style="margin-bottom:24px"><h2>Cevap bekleyen sorular <span class="faint">${cards.length}</span></h2><div class="list">${cards.join("")}</div>${hiddenNote}</div>`;
}

function renderQueue() {
  const waiting = overview.tasks.filter((task) => WAITING_ON_OWNER.includes(task.status));
  const prOpen = overview.tasks.filter((task) => task.status === "pr_open");
  const group = (title, tasks, ranked) => `<div><h2>${title} <span class="faint">${tasks.length}</span></h2>
    <div class="list">${tasks.map((task, index) => taskItem(task, ranked ? index + 1 : null)).join("") || `<div class="empty">Yok</div>`}</div></div>`;
  document.getElementById("tab-queue").innerHTML = renderQuestions() + `<div class="columns">${group("Sırada (runner bu sırayla alır)", overview.queue, true)
    + group("Senden bekleyen", waiting, false)
    + group("Doğrulama bekleyen (runner bunları da alır)", waitingVerification(), false)
    + group("PR açık", prOpen, false)}</div>`;
}

/* ---------- Board ---------- */

function renderBoard() {
  const columnFilter = document.getElementById("column-filter");
  const columns = [...new Set(overview.board.map((item) => item.column).filter(Boolean))];
  if (columnFilter.options.length !== columns.length + 1) {
    const previous = columnFilter.value;
    columnFilter.innerHTML = `<option value="">Tüm kolonlar</option>` + columns.map((column) => `<option>${escapeHtml(column)}</option>`).join("");
    columnFilter.value = columns.includes(previous) ? previous : "";
  }
  const query = document.getElementById("search").value.trim().toLowerCase();
  const items = overview.board.filter((item) => (!columnFilter.value || item.column === columnFilter.value)
    && (!query || item.title.toLowerCase().includes(query) || item.key.toLowerCase().includes(query)));
  document.getElementById("board-updated").textContent = `pinq-ponq'a atanmış ${items.length} kart · board en son ${formatDateTime(overview.board_updated_at)}'da okundu`;
  const cardItem = (item) => `<div class="item">
    <div class="grow"><a class="card-key" href="${issueUrl(item.key)}" target="_blank">${escapeHtml(shortKey(item.key))}</a>
      <div class="card-title">${escapeHtml(item.title)}</div></div>
    ${QUEUEABLE.has(item.runner_status) && item.state !== "CLOSED" ? `<button class="btn-ghost" data-queue="${escapeHtml(item.key)}">Sıraya al</button>` : statusPill(item.runner_status)}
  </div>`;
  const columnRank = (column) => { const rank = BOARD_COLUMN_ORDER.indexOf(column); return rank < 0 ? BOARD_COLUMN_ORDER.length : rank; };
  const boardColumns = columns.filter((column) => items.some((item) => item.column === column))
    .sort((first, second) => columnRank(first) - columnRank(second));
  document.getElementById("board").innerHTML = boardColumns.map((column) => {
    const columnItems = items.filter((item) => item.column === column);
    return `<div><h3>${escapeHtml(column)} <span class="faint">${columnItems.length}</span></h3><div class="list">${columnItems.map(cardItem).join("")}</div></div>`;
  }).join("") || `<div class="list"><div class="empty">Eşleşen kart yok</div></div>`;
}

function renderLog() {
  document.getElementById("runs-log").innerHTML = overview.runs_log.map((line) => {
    const match = line.match(/^(\S+)\s+(\S+?):\s*(.*)$/);
    return match ? `<div><span class="faint tiny">${formatDateTime(match[1])} · ${escapeHtml(match[2])}</span><br>${escapeHtml(match[3])}</div>` : `<div>${escapeHtml(line)}</div>`;
  }).join("");
}

function formatResetIn(resetsAt) {
  if (!resetsAt) return "";
  const seconds = Math.max(0, Math.round((Date.parse(resetsAt) - Date.now()) / 1000));
  return seconds >= 86400 ? `${Math.floor(seconds / 86400)} g ${Math.round(seconds % 86400 / 3600)} sa` : formatDuration(seconds);
}

function usageMeter(label, window) {
  if (!window || window.percent == null) return "";
  const level = window.percent >= USAGE_HIGH_PERCENT ? "high" : window.percent >= USAGE_MID_PERCENT ? "mid" : "";
  const reset = window.resets_at ? ` · ${formatResetIn(window.resets_at)} sonra sıfırlanır` : "";
  return `<span class="meter ${level}" title="${escapeHtml(label + reset)}">${label}<span class="track"><span class="fill" style="width:${Math.min(100, window.percent)}%"></span></span><b>%${window.percent}</b></span>`;
}

function renderUsage() {
  const current = overview.plan_usage && overview.plan_usage.current;
  document.getElementById("usage").innerHTML = current
    ? usageMeter("5 saat", current.five_hour) + usageMeter("Haftalık", current.weekly)
      + `<span class="faint" title="${current.source === "live" ? "sohbetten okunan anlık değer" : "Claude uygulamasının kaydı"}">${formatClock(current.captured_at)}</span>`
    : "";
  renderUsageChart();
}

function localDay(at) { const date = new Date(at); return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`; }

function renderUsageChart() {
  const chart = document.getElementById("usage-chart");
  if (!chart) return;
  const history = (overview && overview.plan_usage && overview.plan_usage.history) || [];
  const days = {};
  const dayFor = (key) => days[key] ||= { weekly: null, fiveHourPeak: null, runnerSeconds: 0, cacheRead: 0, output: 0, runs: 0 };
  for (const sample of history) {
    const day = dayFor(localDay(sample.at));
    if (sample.weekly != null) day.weekly = sample.weekly;
    if (sample.five_hour != null) day.fiveHourPeak = Math.max(day.fiveHourPeak ?? 0, sample.five_hour);
  }
  for (const session of (metrics && metrics.sessions) || []) {
    if (isIdleRun(session)) continue;
    const day = dayFor(localDay(session.started_at));
    day.runs += 1; day.runnerSeconds += session.wall_seconds;
    day.cacheRead += session.cache_read_tokens + sumBy(session.subagents, (agent) => agent.cache_read_tokens);
    day.output += session.output_tokens + sumBy(session.subagents, (agent) => agent.output_tokens);
  }
  const rows = Object.entries(days).sort(([first], [second]) => second.localeCompare(first)).slice(0, USAGE_TABLE_DAYS);
  const percentCell = (value) => value == null ? `<span class="faint">—</span>` : `%${value}`;
  chart.innerHTML = rows.length ? `<div class="table-wrap"><table><tr><th>Gün</th><th class="num">Haftalık (gün sonu)</th><th class="num">5 saatlik (en yüksek)</th><th class="num">Runner koşusu</th><th class="num">Runner süresi</th><th class="num">Cache okuma</th><th class="num">Çıktı</th></tr>
    ${rows.map(([day, values]) => `<tr><td>${new Date(day + "T12:00:00").toLocaleDateString("tr-TR", { weekday: "short", day: "numeric", month: "short" })}</td>
      <td class="num">${percentCell(values.weekly)}</td><td class="num">${percentCell(values.fiveHourPeak)}</td><td class="num">${values.runs}</td>
      <td class="num">${formatDuration(values.runnerSeconds)}</td><td class="num">${formatTokens(values.cacheRead)}</td><td class="num">${formatTokens(values.output)}</td></tr>`).join("")}</table></div>
    <div class="tiny faint" style="margin-top:8px">Yüzdeler Claude uygulamasının kayıtlarından (uygulama her saat kaydetmiyor, boş günler "—"); runner sütunları seçili döneme göre.</div>`
    : `<div class="muted small">Henüz kayıt yok.</div>`;
}

function render() {
  document.getElementById("updated").textContent = "güncel · " + formatClock(overview.now);
  renderUsage();
  renderAttention(); renderRunners(); renderUpNext(); renderHistory();
  renderQueue(); renderBoard(); renderLog();
}

async function refresh() {
  try {
    overview = await (await fetch("/api/overview")).json();
    render();
  } catch (error) {
    document.getElementById("updated").textContent = "sunucuya ulaşılamıyor";
  }
}

/* ---------- Metrikler ---------- */

let metrics = null;
let selectedMetricsSessionId = null;
const sumBy = (items, read) => items.reduce((total, item) => total + (read(item) || 0), 0);
const toolSecondsTotal = (item) => Object.values(item.tool_seconds || {}).reduce((total, seconds) => total + seconds, 0);
const isIdleRun = (session) => session.tool_calls <= 3 && !session.subagents.length;

async function loadMetrics() {
  metrics = await (await fetch("/api/metrics?days=" + document.getElementById("metrics-days").value)).json();
  renderMetrics();
}

function renderBars(entries) {
  const largest = Math.max(1, ...entries.map((entry) => entry.value));
  return entries.map((entry) => `<div class="bar-row"><span>${entry.icon || ""}</span><div><div class="name ellipsis">${escapeHtml(entry.name)}</div>${entry.sub ? `<div class="tiny muted">${escapeHtml(entry.sub)}</div>` : ""}</div>
    <div class="value">${escapeHtml(entry.label)}</div><div class="bar"><i style="width:${(entry.value / largest * 100).toFixed(1)}%"></i></div></div>`).join("") || `<div class="muted">Veri yok</div>`;
}

function aggregateTasks(sessions) {
  const totals = {};
  const emptyTotals = (key) => ({ key, runs: 0, wall: 0, output: 0, cacheRead: 0, agents: 0, kinds: {} });
  for (const session of sessions) {
    const task = totals[session.main_task] ||= emptyTotals(session.main_task);
    task.runs += 1; task.wall += session.wall_seconds; task.agents += session.subagents.length;
    task.output += session.output_tokens + sumBy(session.subagents, (agent) => agent.output_tokens);
    task.cacheRead += session.cache_read_tokens + sumBy(session.subagents, (agent) => agent.cache_read_tokens);
  }
  for (const timing of metrics.timings) {
    if (timing.task === "-") continue;
    (totals[timing.task] ||= emptyTotals(timing.task)).kinds = timing.kinds;
  }
  return Object.values(totals).sort((first, second) => second.cacheRead - first.cacheRead);
}

function aggregateAgents(agents) {
  const totals = {};
  for (const agent of agents) {
    const type = totals[agent.type] ||= { type: agent.type, count: 0, wall: 0, model: 0, calls: 0, output: 0, cacheRead: 0, peak: 0 };
    type.count += 1; type.wall += agent.wall_seconds; type.model += agent.model_seconds; type.calls += agent.tool_calls;
    type.output += agent.output_tokens; type.cacheRead += agent.cache_read_tokens; type.peak = Math.max(type.peak, agent.peak_context_tokens);
  }
  return Object.values(totals).sort((first, second) => second.wall - first.wall);
}

function renderMetrics() {
  renderUsageChart();
  const sessions = metrics.sessions.filter((session) => !isIdleRun(session));
  const agents = sessions.flatMap((session) => session.subagents);
  const kpi = (value, label, sub) => `<div class="card kpi"><div class="value">${value}</div><div class="label">${label}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
  const totalCacheRead = sumBy(sessions, (session) => session.cache_read_tokens) + sumBy(agents, (agent) => agent.cache_read_tokens);
  const totalOutput = sumBy(sessions, (session) => session.output_tokens) + sumBy(agents, (agent) => agent.output_tokens);
  document.getElementById("metrics-kpis").innerHTML = [
    kpi(formatDuration(sumBy(sessions, (session) => session.wall_seconds)), "runner çalışma süresi", `${sessions.length} koşu · ${metrics.sessions.length - sessions.length} boşta`),
    kpi(formatTokens(totalCacheRead), "cache okuma token", ""),
    kpi(formatTokens(totalOutput), "çıktı token", `${agents.length} agent çağrısı dahil`),
  ].join("");
  const tasks = aggregateTasks(sessions.filter((session) => session.main_task));
  document.getElementById("metrics-top-tasks").innerHTML = renderBars(tasks.slice(0, 6).map((task) => ({
    name: titleFor(task.key) || shortKey(task.key), sub: `${shortKey(task.key)} · ${task.runs} koşu · ${formatDuration(task.wall)}`,
    value: task.cacheRead, label: formatTokens(task.cacheRead) })));
  document.getElementById("metrics-top-agents").innerHTML = renderBars(aggregateAgents(agents).map((type) => ({
    icon: avatar(type.type, 36), name: type.type, sub: `${type.count} çağrı · ortalama ${formatDuration(Math.round(type.wall / type.count))} · ${formatTokens(type.cacheRead)} cache okuma`,
    value: type.wall, label: formatDuration(type.wall) })));
  document.getElementById("metrics-tables-toggle").textContent = toggleLabel("metrics-tables", "Tüm tablolar ▾", "Tabloları gizle ▴");
  document.getElementById("metrics-tables").innerHTML = expanded.has("metrics-tables") ? renderMetricsTables(sessions, tasks, agents) : "";
}

function renderMetricsTables(sessions, tasks, agents) {
  const kindCell = (task, kind) => task.kinds[kind] ? `${formatDuration(Math.round(task.kinds[kind].seconds))} <span class="faint">×${task.kinds[kind].count}</span>` : "";
  const taskTable = `<tr><th>Task</th><th class="num">Koşu</th><th class="num">Süre</th><th class="num">Çıktı</th><th class="num">Cache okuma</th><th class="num">Build</th><th class="num">Test</th><th class="num">PIT</th><th class="num">Cihaz</th></tr>`
    + tasks.map((task) => `<tr><td><a href="${issueUrl(task.key)}" target="_blank">${escapeHtml(shortKey(task.key))}</a></td><td class="num">${task.runs}</td><td class="num">${formatDuration(task.wall)}</td>
      <td class="num">${formatTokens(task.output)}</td><td class="num">${formatTokens(task.cacheRead)}</td>
      <td class="num">${kindCell(task, "build")}</td><td class="num">${kindCell(task, "test")}</td><td class="num">${kindCell(task, "pit")}</td><td class="num">${kindCell(task, "device")}</td></tr>`).join("");
  const agentTable = `<tr><th>Agent</th><th class="num">Çağrı</th><th class="num">Toplam</th><th class="num">Ortalama</th><th class="num">Model</th><th class="num">Adım</th><th class="num">Çıktı</th><th class="num">Cache okuma</th><th class="num">En büyük bağlam</th></tr>`
    + aggregateAgents(agents).map((type) => `<tr><td><div class="row">${avatar(type.type, 24)}<b>${escapeHtml(type.type)}</b></div></td><td class="num">${type.count}</td><td class="num">${formatDuration(type.wall)}</td>
      <td class="num">${formatDuration(Math.round(type.wall / type.count))}</td><td class="num">${formatDuration(type.model)}</td><td class="num">${type.calls}</td>
      <td class="num">${formatTokens(type.output)}</td><td class="num">${formatTokens(type.cacheRead)}</td><td class="num">${formatTokens(type.peak)}</td></tr>`).join("");
  const sessionTable = `<tr><th>Başlangıç</th><th>Runner</th><th>Task</th><th class="num">Süre</th><th class="num">Model</th><th class="num">Araç</th><th class="num">Adım</th><th class="num">Cache okuma</th><th class="num">Çıktı</th></tr>`
    + sessions.map((session) => `<tr class="clickable" data-metrics-session="${escapeHtml(session.id)}"><td>${formatDateTime(session.started_at)}</td><td>${escapeHtml(session.scheduled_task ? runnerLabel(session.scheduled_task) : "elle")}</td>
      <td>${escapeHtml(session.main_task ? shortKey(session.main_task) : "")}</td><td class="num">${formatDuration(session.wall_seconds)}</td><td class="num">${formatDuration(session.model_seconds)}</td>
      <td class="num">${formatDuration(toolSecondsTotal(session))}</td><td class="num">${session.tool_calls}</td><td class="num">${formatTokens(session.cache_read_tokens)}</td>
      <td class="num">${formatTokens(session.output_tokens)}</td></tr>`).join("");
  return `<h2 style="font-size:13px;color:var(--muted);margin:24px 0 10px">Task başına</h2><div class="table-wrap"><table>${taskTable}</table></div>
    <h2 style="font-size:13px;color:var(--muted);margin:24px 0 10px">Agent türüne göre</h2><div class="table-wrap"><table>${agentTable}</table></div>
    <h2 style="font-size:13px;color:var(--muted);margin:24px 0 10px">Koşular · satıra tıkla: süre nereye gitti</h2><div class="table-wrap"><table>${sessionTable}</table></div>
    <div id="metrics-detail">${selectedMetricsSessionId ? renderMetricsSessionDetail(selectedMetricsSessionId) : ""}</div>`;
}

function renderMetricsSessionDetail(sessionId) {
  const session = metrics.sessions.find((candidate) => candidate.id === sessionId);
  if (!session) return "";
  const entries = [{ name: "Model (düşünme ve yazma)", value: session.model_seconds, label: formatDuration(session.model_seconds) }]
    .concat(Object.entries(session.tool_seconds).filter(([, seconds]) => seconds > 0).map(([tool, seconds]) => ({
      icon: tool.startsWith("Agent: ") ? avatar(tool.slice(7), 28) : "", name: tool, sub: `${session.tool_counts[tool] || 0} çağrı`, value: seconds, label: formatDuration(seconds) })));
  return `<div class="card" style="margin-top:12px"><div class="row spread"><b>${escapeHtml(session.main_task ? titleFor(session.main_task) || shortKey(session.main_task) : "Bakım")} · ${formatDateTime(session.started_at)}</b>
    <button class="btn-link" data-close-metrics-detail="1">Kapat</button></div>
    <div class="small muted" style="margin:4px 0 14px">Ana oturumun süresi neye gitti</div><div class="bars">${renderBars(entries)}</div></div>`;
}

/* ---------- Harita ---------- */

let systemMap = null;
let selectedNodeId = null;
const nodeDomId = (nodeId) => "node-" + nodeId.replace(/[^\w-]/g, "_");

async function loadSystemMap() {
  systemMap = await (await fetch("/api/map")).json();
  renderSystemMap();
}

function renderSystemMap() {
  document.getElementById("map").innerHTML = `<svg id="map-lines"></svg>` + systemMap.groups.map((group) => `<div class="map-column"><h3>${escapeHtml(group.label)}</h3>
    ${systemMap.nodes.filter((node) => node.group === group.id).map((node) => `<div class="node" id="${nodeDomId(node.id)}" data-node="${escapeHtml(node.id)}"
      title="${escapeHtml((node.description || "") + (node.path ? "\n" + node.path : ""))}">${node.group === "agent" ? avatar(node.label, 22) : ""}<span class="label">${escapeHtml(node.label)}</span></div>`).join("")}</div>`).join("");
  if (selectedNodeId) selectNode(selectedNodeId);
}

function selectNode(nodeId) {
  selectedNodeId = nodeId;
  const node = systemMap.nodes.find((candidate) => candidate.id === nodeId);
  const usesIds = systemMap.edges.filter((edge) => edge.from === nodeId).map((edge) => edge.to);
  const usedByIds = systemMap.edges.filter((edge) => edge.to === nodeId).map((edge) => edge.from);
  const mapElement = document.getElementById("map");
  mapElement.classList.add("focus");
  mapElement.querySelectorAll(".node").forEach((element) => {
    const id = element.dataset.node;
    element.classList.toggle("current", id === nodeId);
    element.classList.toggle("uses", usesIds.includes(id));
    element.classList.toggle("used-by", usedByIds.includes(id));
    element.classList.toggle("related", id === nodeId || usesIds.includes(id) || usedByIds.includes(id));
  });
  drawMapLines(nodeId, usesIds, usedByIds);
  const labelFor = (id) => (systemMap.nodes.find((candidate) => candidate.id === id) || { label: id }).label;
  const linkList = (ids) => ids.length ? `<div class="link-list">${ids.map((id) => `<span class="pill" data-node="${escapeHtml(id)}">${escapeHtml(labelFor(id))}</span>`).join("")}</div>` : `<div class="muted small" style="margin:6px 0 12px">yok</div>`;
  document.getElementById("map-detail").innerHTML = `<div class="row spread"><div class="row">${node.group === "agent" ? avatar(node.label, 44) : ""}<b style="font-size:18px">${escapeHtml(node.label)}</b></div>
      ${node.viewable ? `<button class="btn-ghost" data-view-file="${escapeHtml(node.id)}">İçeriği göster</button>` : ""}</div>
    ${node.description ? `<p style="font-size:15px">${escapeHtml(node.description)}</p>` : ""}
    <div class="small"><b>Kullandıkları</b></div>${linkList(usesIds)}
    <div class="small"><b>Onu kullananlar</b></div>${linkList(usedByIds)}
    <div class="tiny faint">${escapeHtml(node.path || "")}${node.model ? ` · model ${escapeHtml(node.model)}` : ""}${node.modified_at ? ` · son değişiklik ${formatDateTime(node.modified_at)}` : ""}</div>
    <div id="file-content"></div>`;
}

function drawMapLines(nodeId, usesIds, usedByIds) {
  const svg = document.getElementById("map-lines");
  const mapRect = document.getElementById("map").getBoundingClientRect();
  const anchor = (id) => {
    const element = document.getElementById(nodeDomId(id));
    if (!element) return null;
    const rect = element.getBoundingClientRect();
    return { left: rect.left - mapRect.left, right: rect.right - mapRect.left, middle: rect.top - mapRect.top + rect.height / 2 };
  };
  const curve = (fromId, toId, color) => {
    const start = anchor(fromId), end = anchor(toId);
    if (!start || !end) return "";
    if (Math.abs(start.left - end.left) < 5) {
      return `<path d="M${start.right},${start.middle} C${start.right + 40},${start.middle} ${end.right + 40},${end.middle} ${end.right},${end.middle}" fill="none" stroke="${color}" stroke-width="1.5" opacity=".8"/>`;
    }
    const goesRight = end.left >= start.right - 1;
    const startX = goesRight ? start.right : start.left, endX = goesRight ? end.left : end.right;
    const bend = Math.max(40, Math.abs(endX - startX) / 2) * (goesRight ? 1 : -1);
    return `<path d="M${startX},${start.middle} C${startX + bend},${start.middle} ${endX - bend},${end.middle} ${endX},${end.middle}" fill="none" stroke="${color}" stroke-width="1.5" opacity=".8"/>`;
  };
  svg.setAttribute("width", mapRect.width);
  svg.setAttribute("height", mapRect.height);
  svg.innerHTML = usesIds.map((id) => curve(nodeId, id, "var(--accent)")).join("") + usedByIds.map((id) => curve(id, nodeId, "var(--ok)")).join("");
}

async function viewMapFile(nodeId) {
  const response = await fetch("/api/file?id=" + encodeURIComponent(nodeId));
  const result = await response.json();
  document.getElementById("file-content").innerHTML = response.ok
    ? `${result.truncated ? `<div class="tiny muted" style="margin-top:10px">kısaltıldı</div>` : ""}<pre>${escapeHtml(result.content)}</pre>`
    : `<div class="muted">${escapeHtml(result.error)}</div>`;
}

/* ---------- olaylar ---------- */

function switchTab(tab) {
  document.querySelectorAll("#tabs button").forEach((button) => button.classList.toggle("on", button.dataset.tab === tab));
  document.querySelectorAll("main > section").forEach((section) => section.hidden = section.id !== "tab-" + tab);
  if (tab === "metrics" && !metrics) loadMetrics();
  if (tab === "map" && !systemMap) loadSystemMap();
}

document.addEventListener("click", async (event) => {
  const target = event.target.closest("button, [data-node], [data-metrics-session]");
  if (!target) return;
  const data = target.dataset;
  if (data.tab) switchTab(data.tab);
  else if (data.goto) switchTab(data.goto);
  else if (data.toggle) {
    expanded.has(data.toggle) ? expanded.delete(data.toggle) : expanded.add(data.toggle);
    if (data.toggle === "metrics-tables") renderMetrics(); else render();
  }
  else if (data.start) {
    if (confirm(`${runnerLabel(data.start)} başlatılsın mı?`) && await postAction("/api/start", { scheduled_task: data.start })) showToast("Başlatma isteği gönderildi");
  }
  else if (data.queue) {
    const priority = prompt(`"${titleFor(data.queue)}" hangi öncelikle sıraya alınsın?\nKüçük sayı önce alınır.`, "5");
    if (priority !== null && await postAction("/api/queue", { key: data.queue, priority: Number(priority) })) showToast("Sıraya alındı");
  }
  else if (data.priority) {
    const priority = prompt(`"${titleFor(data.priority)}" için yeni öncelik (küçük sayı önce):`, data.current);
    if (priority !== null && priority !== "" && await postAction("/api/priority", { key: data.priority, priority: Number(priority) })) showToast("Öncelik güncellendi");
  }
  else if (data.answerKey) {
    const answer = data.answerValue ?? prompt(`${data.answerQuestion} için cevabın:`, "");
    if (answer && answer.trim() && confirm(`${data.answerQuestion}: ${answer.trim()} olarak kaydedilsin mi?\nRunner bir sonraki koşuda bu cevapla devam eder.`)) {
      const result = await postAction("/api/answer", { key: data.answerKey, question: data.answerQuestion, answer: answer.trim() });
      if (result) showToast(result.remaining_questions ? `Kaydedildi · ${result.remaining_questions} soru daha var` : "Kaydedildi · runner'ı başlatabilirsin");
    }
  }
  else if (data.unqueue) {
    if (confirm(`"${titleFor(data.unqueue)}" sıradan çıkarılsın mı?`) && await postAction("/api/unqueue", { key: data.unqueue })) showToast("Sıradan çıkarıldı");
  }
  else if (data.metricsSession) { selectedMetricsSessionId = data.metricsSession; renderMetrics(); document.getElementById("metrics-detail").scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  else if (data.closeMetricsDetail) { selectedMetricsSessionId = null; renderMetrics(); }
  else if (data.node && systemMap) selectNode(data.node);
  else if (data.viewFile) viewMapFile(data.viewFile);
  else if (target.id === "map-reload") loadSystemMap();
  else if (target.id === "metrics-reload") loadMetrics();
});

document.getElementById("search").addEventListener("input", () => overview && renderBoard());
document.getElementById("column-filter").addEventListener("change", () => overview && renderBoard());
document.getElementById("metrics-days").addEventListener("change", loadMetrics);
window.addEventListener("resize", () => selectedNodeId && systemMap && selectNode(selectedNodeId));

refresh();
setInterval(refresh, REFRESH_MILLISECONDS);
</script>
